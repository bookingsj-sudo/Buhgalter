<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Деньги</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Деньги">
<meta name="theme-color" content="#0F2A2C">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
</head>
<body>
<div id="root"></div>

<style>
  :root{
    --ink:#0F2A2C;
    --paper:#ECEFEA;
    --card:#FFFFFF;
    --muted:#6E817D;
    --line:#DBE1DC;
    --good:#1F7A5C;
    --warn:#9A6B08;
    --bad:#A8371F;
    --soft:#F5F7F3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#ECEFEA;height:100%}
  #root{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    font-size:15px;
    line-height:1.45;
    padding-bottom:78px;
    min-height:100%;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 0}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

  .hero{background:var(--ink);color:#EFF3EE;border-radius:20px;padding:20px 18px 16px;margin-bottom:12px}
  .hero .lbl{font-size:13px;color:#9FB5B0;margin-bottom:2px}
  .hero .big{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-0.03em}
  .hero .big.neg{color:#F0A28E}
  .hero .sub{font-size:13px;color:#9FB5B0;margin-top:6px}
  .heroRow{display:flex;gap:10px;margin-top:16px;border-top:1px solid #2A4749;padding-top:12px}
  .heroCell{flex:1}
  .heroCell .k{font-size:11px;color:#8FA9A4;margin-bottom:1px}
  .heroCell .v{font-size:16px;font-weight:700}

  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:700}
  .card h3 .aside{float:right;font-weight:500;font-size:13px;color:var(--muted)}

  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft)}
  .row:last-child{border-bottom:none}
  .row .t{flex:1;min-width:0}
  .row .t b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .t small{color:var(--muted);font-size:12px}
  .row .v{font-weight:700;white-space:nowrap}

  input,select,button,textarea{font-family:inherit;font-size:15px}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn:active{opacity:.75}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .inline{display:flex;gap:8px;align-items:center}

  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--soft);color:var(--muted)}
  .tag.hot{background:#F7E4DF;color:var(--bad)}
  .tag.mid{background:#F7EEDA;color:var(--warn)}
  .tag.cool{background:#E2EFE9;color:var(--good)}
  .tag.zero{background:#E7EAF0;color:#4A5A6B}

  .alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
  .alert.bad{background:#F7E4DF;color:#6E2010}
  .alert.warn{background:#F9F0DB;color:#5E4406}
  .alert.ok{background:#E2EFE9;color:#134E3A}

  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;min-width:0;background:none;border:none;padding:11px 1px 13px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;white-space:nowrap}
  .tabs button .ic{font-size:17px;line-height:1}
  .tabs button.on{color:var(--ink)}

  .bar{height:7px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--good);border-radius:6px}

  .mini{font-size:12px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
  .sep{height:1px;background:var(--line);margin:12px 0}
  .loan{padding:10px 0;border-bottom:1px solid var(--soft)}
  .loan:last-child{border-bottom:none}
  .loan .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .loan .nm{font-weight:600}
  .loan .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .done{opacity:.42}
  .chart{width:100%;height:120px;display:block}
  .editrow{display:grid;grid-template-columns:44px 1fr 84px 84px 30px;gap:6px;align-items:center;padding:5px 0}
  .editrow input{padding:8px;font-size:13px;border-radius:9px}
  .editrow .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  .head{display:grid;grid-template-columns:44px 1fr 84px 84px 30px;gap:6px;font-size:11px;color:var(--muted);padding-bottom:4px}
  .ask{display:flex;flex-direction:column;gap:7px}
  .ask button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;font-weight:600}
  .ask button:active{background:var(--soft)}
  .ask button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .steps{counter-reset:st;margin:0;padding:0;list-style:none}
  .steps li{counter-increment:st;position:relative;padding:0 0 8px 26px;font-size:13.5px;line-height:1.4}
  .steps li:before{content:counter(st);position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .tl{margin:2px 0 0}
  .tl .d{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft);align-items:flex-start}
  .tl .d:last-child{border-bottom:none}
  .tl .dt{width:58px;flex:none;font-size:12px;color:var(--muted);padding-top:2px;line-height:1.3}
  .tl .dt b{display:block;font-size:13px;color:var(--ink);font-weight:700}
  .tl .ev{flex:1;min-width:0}
  .tl .ev .e{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
  .tl .ev .e span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl .ev .e .m{font-weight:600;white-space:nowrap}
  .tl .ev .e .m.p{color:var(--good)}
  .tl .bal{font-size:12px;color:var(--muted);margin-top:3px}
  .tl .bal b{font-weight:700;color:var(--ink)}
  .tl .d.neg{background:#FCF1EE;margin:0 -8px;padding:8px;border-radius:9px;border-bottom:none}
  .tl .d.neg .bal b{color:var(--bad)}

  .due{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft)}
  .due:last-child{border-bottom:none}
  .due .i{flex:1;min-width:0}
  .due .i b{display:block;font-weight:600;font-size:14px}
  .due .i small{color:var(--muted);font-size:12px}
  .due .a{font-weight:700;white-space:nowrap;font-size:14px}
  .due.late .i b{color:var(--bad)}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
  .chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-weight:600}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .opt{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;background:#fff}
  .opt.pick{border-color:var(--ink);border-width:2px;padding:10px 11px}
  .opt .oh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:5px}
  .opt .oh b{font-size:14px}
  .opt .ol{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--muted)}
  .fixrow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--soft)}
  .fixrow span:first-child{min-width:0;flex:1}
  .fixrow span:last-child{white-space:nowrap;font-weight:600}
  .opt .ol span:last-child{font-weight:600;color:var(--ink)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;z-index:40;opacity:0;transition:opacity .18s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
  "use strict";

  /* ---------- дефолтные данные ---------- */
  var DEFAULT_LOANS = [
    // Freedom / МФО — платёж 18-го
    {id:'MFO', name:'МФО Freedom', payoff:501704, payment:50642, months:12, rate:37.0, prio:6, day:18},
    // рассрочка (0%)
    {id:'R1', name:'Рассрочка 1',  payoff:66617,  payment:4441,  months:15, rate:0,    prio:0},
    {id:'R2', name:'Рассрочка 2',  payoff:218719, payment:72906, months:3,  rate:0,    prio:0},
    {id:'R3', name:'Рассрочка 3',  payoff:33332,  payment:3333,  months:10, rate:0,    prio:0},
    {id:'R4', name:'Рассрочка 4',  payoff:34484,  payment:11495, months:3,  rate:0,    prio:0},
    // кредиты
    {id:'K1',  name:'Кредит 1',  payoff:10026,  payment:5088,  months:2,  rate:11.8, prio:0},
    {id:'K2',  name:'Кредит 2',  payoff:86973,  payment:10089, months:10, rate:33.6, prio:5},
    {id:'K3',  name:'Кредит 3',  payoff:30002,  payment:5163,  months:6,  rate:11.0, prio:0},
    {id:'K4',  name:'Кредит 4',  payoff:13849,  payment:2053,  months:7,  rate:11.2, prio:0},
    {id:'K5',  name:'Кредит 5',  payoff:43026,  payment:4991,  months:10, rate:33.6, prio:3},
    {id:'K6',  name:'Кредит 6',  payoff:129922, payment:11473, months:12, rate:10.9, prio:0},
    {id:'K7',  name:'Кредит 7',  payoff:8942,   payment:3040,  months:3,  rate:12.0, prio:0},
    {id:'K8',  name:'Кредит 8',  payoff:19901,  payment:4091,  months:5,  rate:11.0, prio:0},
    {id:'K9',  name:'Кредит 9',  payoff:9917,   payment:2040,  months:5,  rate:11.2, prio:0},
    {id:'K10', name:'Кредит 10', payoff:13880,  payment:2057,  months:7,  rate:11.2, prio:0},
    {id:'K11', name:'Кредит 11', payoff:46140,  payment:5023,  months:11, rate:37.6, prio:1},
    {id:'K12', name:'Кредит 12', payoff:352537, payment:14398, months:48, rate:38.6, prio:8},
    {id:'K13', name:'Кредит 13', payoff:150318, payment:9039,  months:24, rate:38.1, prio:7},
    {id:'K14', name:'Кредит 14', payoff:151863, payment:10880, months:15, rate:11.0, prio:0},
    {id:'K15', name:'Кредит 15', payoff:131829, payment:9029,  months:17, rate:21.0, prio:9},
    {id:'K16', name:'Кредит 16', payoff:80574,  payment:10035, months:9,  rate:28.2, prio:4},
    {id:'K17', name:'Кредит 17', payoff:50746,  payment:5141,  months:12, rate:37.7, prio:2},
    {id:'K18', name:'Кредит 18', payoff:33872,  payment:6963,  months:5,  rate:11.0, prio:0},
    {id:'K19', name:'Кредит 19', payoff:262270, payment:17962, months:17, rate:21.0, prio:10},
    {id:'K20', name:'Кредит 20', payoff:29600,  payment:5093,  months:6,  rate:11.0, prio:0},
    {id:'K21', name:'Кредит 21', payoff:27384,  payment:4058,  months:7,  rate:11.0, prio:0}
  ];

  var DEFAULT_BILLS = [
    {id:'b1', day:5,  title:'Подписка (голос)',   min:5000,   max:5000,   on:true},
    {id:'b2', day:12, title:'Claude',             min:11000,  max:11000,  on:true},
    {id:'b3', day:17, title:'Квартира',           min:120000, max:120000, on:true},
    {id:'b4', day:17, title:'Студия',             min:120000, max:120000, on:true},
    {id:'b5', day:20, title:'Коммуналка',         min:10000,  max:15000,  on:true},
    {id:'b6', day:30, title:'Интернет дома',      min:5000,   max:5000,   on:true},
    {id:'b7', day:30, title:'Интернет студия',    min:11000,  max:11000,  on:true}
  ];

  var DEFAULT_INCOMES = [
    {id:'i1', day:1,  title:'Зарплата', min:150000, max:150000, plan:150000, delay:2, on:true},
    {id:'i2', day:15, title:'Бонус',    min:500000, max:1500000, plan:700000, delay:5, on:true, fromConcerts:true}
  ];

  function clone(a){return a.map(function(o){var c={};for(var k in o)c[k]=o[k];return c;});}

  var S = {
    balance:0,
    pot:0,
    foodDay:10000,
    mode:'plan',          // 'min' пессимистично | 'plan' по ожиданию
    loans:DEFAULT_LOANS.map(function(l){var c={};for(var k in l)c[k]=l[k];c.closed=false;return c;}),
    bills:clone(DEFAULT_BILLS),
    incomes:clone(DEFAULT_INCOMES),
    tx:[],
    paid:{},              // 'b3|2026-09' → {amt, ts} — факт оплаты/получения за конкретный месяц
    concerts:[],          // {id, ym:'2026-09', day, venue, title, fee}
    fee:100000,           // ставка за один концерт
    bonusShift:1,         // бонус за месяц приходит через N месяцев (1 = в следующем)
    floor:6000,           // минимум на жизнь в день — еда, проезд, сигареты; ниже не бывает
    cushion:290523,       // цель подушки: платежи Kaspi 12-го + МФО 18-го
    cushionHave:0,
    since:0,              // dnum дня, с которого следим за просрочкой
    tab:'today',
    ready:false
  };

  var KEY='fin:v1';

  /* ---------- хранилище ---------- */
  function persist(){
    bust();
    var data=snapshot();
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){
      // место кончилось — история самое объёмное, но терять её нельзя молча
      try{toast('Не удалось сохранить: в браузере кончилось место');}catch(e2){}
    }
  }

  /* всё состояние целиком — и для localStorage, и для резервной копии.
     История НЕ обрезается: раньше здесь стояло tx.slice(0,400) и записи
     старше ~40 дней пропадали без предупреждения. */
  function snapshot(){
    return {balance:S.balance,pot:S.pot,foodDay:S.foodDay,mode:S.mode,
            loans:S.loans,bills:S.bills,incomes:S.incomes,tx:S.tx,
            paid:S.paid,concerts:S.concerts,fee:S.fee,bonusShift:S.bonusShift,floor:S.floor,
            cushion:S.cushion,cushionHave:S.cushionHave,since:S.since};
  }
  function load(cb){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var d=JSON.parse(raw);
        for(var k in d){ if(d[k]!==undefined&&d[k]!==null) S[k]=d[k]; }
      }
    }catch(e){}
    migrate();
    S.ready=true;cb();
  }

  function migrate(){
    var has=false;
    S.loans.forEach(function(l){if(l.id==='MFO')has=true;});
    if(!has){
      var bump={'K13':7,'K12':8,'K15':9,'K19':10};
      S.loans.forEach(function(l){if(bump[l.id])l.prio=bump[l.id];});
      S.loans.unshift({id:'MFO',name:'МФО Freedom',payoff:501704,payment:50642,
                       months:12,rate:37.0,prio:6,day:18,closed:false});
      persist();
    }
    S.loans.forEach(function(l){if(!l.day)l.day=12;});

    // поля, появившиеся в версии 2
    if(!S.paid||typeof S.paid!=='object')S.paid={};
    if(!S.concerts)S.concerts=[];
    if(typeof S.fee!=='number'||!S.fee)S.fee=100000;
    if(typeof S.bonusShift!=='number')S.bonusShift=1;
    if(typeof S.floor!=='number')S.floor=6000;
    if(typeof S.cushion!=='number')S.cushion=290523;
    if(typeof S.cushionHave!=='number')S.cushionHave=0;
    S.tx.forEach(function(x){if(!x.cat)x.cat=guessCat(x.title,x.amount);});
    // с какого дня следим за просрочкой: всё, что было до первого запуска
    // новой версии, считаем закрытым — иначе вывалится месяц мнимых долгов
    if(!S.since)S.since=dnum(today());
    var bonus=S.incomes.filter(function(i){return i.id==='i2';})[0];
    if(bonus&&bonus.fromConcerts===undefined){bonus.fromConcerts=true;bonus.delay=5;}
    var sal=S.incomes.filter(function(i){return i.id==='i1';})[0];
    if(sal&&!sal.delay)sal.delay=2;
  }

  /* ---------- категории ---------- */
  var CATS=[
    ['food',   'Еда',            '🍽'],
    ['deliv',  'Доставка',       '🛵'],
    ['transp', 'Транспорт',      '🚕'],
    ['home',   'Жильё',          '🏠'],
    ['subs',   'Подписки',       '📱'],
    ['loans',  'Кредиты',        '🏦'],
    ['health', 'Здоровье',       '💊'],
    ['cloth',  'Одежда',         '👕'],
    ['work',   'Студия/работа',  '🎛'],
    ['bad',    'Гадости',        '🚬'],
    ['inc',    'Доход',          '＋'],
    ['other',  'Прочее',         '•'],
    ['unknown','Не распознано',  '?']
  ];
  var CATWORDS={
    food:['еда','обед','ужин','завтрак','кафе','ресторан','продукт','магазин','столов','перекус','кофе','чай','бургер','пицца','шаурм','суши','вода'],
    deliv:['доставк','вольт','wolt','glovo','яндекс еда','chocofood','чокофуд','самокат'],
    transp:['такси','яндекс','бензин','заправк','автобус','метро','болт','bolt','indrive','индрайв','парковк','каршер'],
    home:['квартир','аренд','жиль','коммуналк','комуналк','квартплат','свет','газ','вода счет','домофон'],
    subs:['подписк','claude','клод','spotify','спотифай','netflix','нетфликс','youtube','ютуб','apple','icloud','интернет','связ','телефон','моб'],
    loans:['кредит','займ','рассрочк','каспи','kaspi','мфо','freedom','фридом','платеж по','досрочно','закрыт'],
    health:['аптек','врач','лекарств','анализ','стоматолог','зуб','клиник','больниц','массаж','витамин'],
    cloth:['одежд','обув','кроссовк','футболк','джинс','куртк','штан','носк','бель'],
    work:['студи','репетиц','аренда зала','микрофон','струн','кабел','инструмент','звук','концерт','аппарат','свет на'],
    bad:['сигарет','сиги','энергет','redbull','ред булл','монстр','monster','адреналин','вейп','под','жвачк','снюс','никотин','пиво','алкогол','бар']
  };
  function guessCat(title,amount){
    if(amount>0)return 'inc';
    var t=String(title||'').toLowerCase();
    for(var k in CATWORDS){
      for(var i=0;i<CATWORDS[k].length;i++){
        if(t.indexOf(CATWORDS[k][i])>=0)return k;
      }
    }
    return 'unknown';
  }
  function catName(id){
    for(var i=0;i<CATS.length;i++)if(CATS[i][0]===id)return CATS[i][1];
    return 'Прочее';
  }
  function catIcon(id){
    for(var i=0;i<CATS.length;i++)if(CATS[i][0]===id)return CATS[i][2];
    return '•';
  }

  /* ---------- утилиты ---------- */
  function fmt(n){
    n=Math.round(n||0);
    var s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (n<0?'−':'')+s;
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function lastDay(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
  function dnum(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
  function ruDate(d){
    var m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    return d.getDate()+' '+m[d.getMonth()];
  }
  function effDay(day,d){return Math.min(day,lastDay(d));}
  function billAmt(b){return S.mode==='min'?b.max:Math.round((b.min+b.max)/2);}
  function incAmt(i,d){
    if(i.fromConcerts){
      var c=concertsFor(d||today());
      // бонус известен точно, как только концерты внесены; пока их нет —
      // падаем на ручные поля, чтобы приложение не показывало ноль дохода
      if(c.n>0)return c.sum;
      return S.mode==='min'?i.min:(i.plan||i.min);
    }
    return S.mode==='min'?i.min:(i.plan||i.min);
  }

  /* ---------- концерты ----------
     Бонус = число отработанных концертов × ставка. Концерты за месяц M
     оплачиваются 15-го числа месяца M+bonusShift. */
  function shiftYM(ym,k){
    var y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5),10)-1+k;
    var d=new Date(y,m,1);
    return ymKey(d);
  }
  /* какие концерты оплачиваются выплатой, попадающей на дату d */
  function concertsFor(d){
    var ym=shiftYM(ymKey(d),-S.bonusShift),sum=0,n=0;
    S.concerts.forEach(function(c){
      if(c.ym===ym){n++;sum+=(typeof c.fee==='number'?c.fee:S.fee);}
    });
    return {n:n,sum:sum,ym:ym};
  }
  function concertsIn(ym){
    return S.concerts.filter(function(c){return c.ym===ym;})
      .sort(function(a,b){return a.day-b.day;});
  }
  function incDay(i){return i.day+(S.mode==='min'?(i.delay||0):0);}

  function kaspiTotal(){
    var s=0;S.loans.forEach(function(l){if(!l.closed)s+=l.payment;});return s;
  }
  function loanDay(l){return l.day||12;}
  function loansOnDay(day){
    var s=0;S.loans.forEach(function(l){if(!l.closed&&loanDay(l)===day)s+=l.payment;});return s;
  }
  function payDays(){
    var d={},out=[];
    S.loans.forEach(function(l){if(!l.closed)d[loanDay(l)]=1;});
    for(var k in d)out.push(parseInt(k,10));
    out.sort(function(a,b){return a-b;});
    return out;
  }
  function dayLabel(day){return day===18?'Платёж МФО':'Платежи Kaspi';}
  function debtTotal(){
    var s=0;S.loans.forEach(function(l){if(!l.closed)s+=l.payoff;});return s;
  }
  function billsMonth(){
    var s=0;S.bills.forEach(function(b){if(b.on)s+=billAmt(b);});return s+kaspiTotal();
  }
  function target(){
    var open=S.loans.filter(function(l){return !l.closed&&l.prio>0;});
    open.sort(function(a,b){return a.prio-b.prio;});
    return open[0]||null;
  }

  /* события дня: [{title, amount(+/-)}] */
  /* ---------- факт оплаты ----------
     Ключ события — «что» + «за какой месяц»: 'b3|2026-09'. Пока отметки нет,
     событие висит в прогнозе; как только отмечено — исчезает из него и больше
     не вычитается. Без этого прогноз врал в обе стороны: платёж, внесённый
     заранее, вычитался дважды, а просроченный пропадал вовсе. */
  function ymKey(d){
    var m=d.getMonth()+1;
    return d.getFullYear()+'-'+(m<10?'0':'')+m;
  }
  function isPaid(key){return !!(S.paid&&S.paid[key]);}
  function markPaid(key,amt,title,d){
    S.paid[key]={amt:amt,ts:Date.now(),d:dnum(d||today())};
    return S.paid[key];
  }
  function unmarkPaid(key){delete S.paid[key];}

  function eventsOn(d){
    var out=[],ym=ymKey(d),k;
    S.incomes.forEach(function(i){
      if(!i.on)return;
      var day=incDay(i),amt=incAmt(i,d);
      if(amt<=0)return;
      if(d.getDate()===effDay(day,d)){
        k=i.id+'|'+ym;
        if(isPaid(k))return;
        out.push({t:i.title,a:amt,key:k,plan:amt,kind:'inc',id:i.id});
      }
    });
    S.bills.forEach(function(b){
      if(!b.on)return;
      if(d.getDate()===effDay(b.day,d)){
        k=b.id+'|'+ym;
        if(isPaid(k))return;
        out.push({t:b.title,a:-billAmt(b),key:k,plan:billAmt(b),kind:'bill',id:b.id});
      }
    });
    payDays().forEach(function(day){
      if(d.getDate()===effDay(day,d)){
        var amt=loansOnDay(day);
        if(amt<=0)return;
        k='L'+day+'|'+ym;
        if(isPaid(k))return;
        out.push({t:dayLabel(day),a:-amt,key:k,plan:amt,kind:'loan',id:'L'+day});
      }
    });
    return out;
  }

  /* Просроченное: всё, что должно было уйти между S.since и сегодняшним днём
     включительно и до сих пор не отмечено оплаченным. Эти деньги фактически
     уже не твои, поэтому они вычитаются из доступных. */
  var _od=null;
  function bust(){_od=null;}
  function overdueList(){
    if(_od)return _od;
    var t=today(),out=[],i,d;
    for(i=-60;i<=0;i++){
      d=addDays(t,i);
      if(dnum(d)<S.since)continue;
      eventsOn(d).forEach(function(e){
        if(e.a<0)out.push({d:new Date(d),e:e});
      });
    }
    _od=out;
    return out;
  }
  function overdueTotal(){
    var s=0;
    overdueList().forEach(function(o){s-=o.e.a;});
    return s;
  }
  /* деньги, которыми реально можно распоряжаться */
  function spendable(){return S.balance-S.pot-overdueTotal();}

  var HORIZON=60;

  /* суммарное изменение баланса по каждому дню вперёд */
  function netStream(days){
    var t=today(),out=[0],i,s;
    for(i=1;i<=days;i++){
      s=0;
      eventsOn(addDays(t,i)).forEach(function(e){s+=e.a;});
      out.push(s);
    }
    return out;
  }

  /* прогон баланса при постоянной дневной трате per */
  function simulate(days,per,net){
    net=net||netStream(days);
    var t=today(),bal=spendable(),pts=[],min=null,i,d;
    for(i=0;i<=days;i++){
      if(i>0)bal+=net[i];
      bal-=per;
      d=addDays(t,i);
      pts.push({d:d,v:bal});
      if(!min||bal<min.v)min={v:bal,d:d};
    }
    return {pts:pts,min:min,end:bal};
  }

  function forecast(days){return simulate(days,S.foodDay);}

  function nextIncome(){
    var t=today();
    for(var i=1;i<=70;i++){
      var d=addDays(t,i),hit=null;
      S.incomes.forEach(function(inc){
        if(!inc.on)return;
        if(d.getDate()===effDay(incDay(inc),d)) hit=hit||{d:d,inc:inc};
      });
      if(hit)return hit;
    }
    return null;
  }

  /* максимальная дневная трата, при которой баланс ни разу не уходит в минус */
  function maxDaily(days,net){
    net=net||netStream(days);
    var zero=simulate(days,0,net);
    if(zero.min.v<0)return {per:0,gap:-zero.min.v,gapDay:zero.min.d,min:zero.min};
    var cap=spendable(),i;
    for(i=1;i<=days;i++)if(net[i]>0)cap+=net[i];
    var lo=0,hi=cap/(days+1)+1,mid;
    for(i=0;i<40;i++){
      mid=(lo+hi)/2;
      if(simulate(days,mid,net).min.v>=0)lo=mid;else hi=mid;
    }
    return {per:lo,gap:0,gapDay:null,min:simulate(days,lo,net).min};
  }

  /* обязательные списания за ближайшие days дней */
  function oblig(days){
    var t=today(),s=0,i;
    for(i=1;i<=days;i++)eventsOn(addDays(t,i)).forEach(function(e){if(e.a<0)s-=e.a;});
    return s;
  }

  /* сколько уже потрачено сегодня по записям */
  function spentToday(){
    var t=today().getTime(),d=ruDate(new Date()),s=0;
    S.tx.forEach(function(x){
      if(x.amount>=0)return;
      // у записей до обновления нет метки времени — для них сверяем дату
      var isToday = x.ts ? (x.ts>=t) : (x.date===d);
      if(isToday)s-=x.amount;
    });
    return s;
  }

  /* худший сценарий: минимальный доход, задержка, нулевые траты */
  function worstGap(days){
    var m=S.mode;S.mode='min';
    var r=simulate(days,0);
    S.mode=m;
    return r.min;
  }

  function daily(){
    var md=maxDaily(HORIZON);
    return {per:md.per,gap:md.gap,gapDay:md.gapDay,min:md.min,
            res:oblig(30),spent:spentToday(),inc:nextIncome()};
  }

  /* Сколько можно тратить сегодня.
     Голый maxDaily() отвечал на вопрос «сколько тебе позволено, чтобы не уйти
     в минус» и при нехватке денег выдавал 0. Это не ответ: человек ест каждый
     день. Поэтому норма никогда не опускается ниже S.floor — минимума на жизнь,
     — а нехватка показывается отдельно, датой и суммой, с вариантами закрыть. */
  function norm(){
    var safe=maxDaily(HORIZON).per, floor=S.floor||0;
    if(safe>=floor) return {per:safe, floored:false, short:0, safe:safe};
    var r=simulate(HORIZON,floor),i,first=null;
    // Дедлайн — это ПЕРВЫЙ день ухода в минус, а не самая глубокая точка.
    // Показывать дно значило называть дату на месяц дальше настоящей
    // и сумму, которую незачем собирать к тому сроку.
    for(i=0;i<r.pts.length;i++){ if(r.pts[i].v<0){ first=r.pts[i]; break; } }
    return {per:floor, floored:true, safe:safe,
            short:first?-first.v:0, day:first?first.d:null,
            worst:r.min.v<0?-r.min.v:0, worstDay:r.min.d};
  }

  /* Какой платёж не удастся оплатить. Сначала смотрим сам день провала —
     именно он не пройдёт. Если в этот день платежей нет (деньги просто
     дотекли до нуля), отступаем назад к ближайшему крупному дню. */
  function dayOut(d){
    var sum=0,names=[];
    eventsOn(d).forEach(function(e){if(e.a<0){sum-=e.a;names.push(e.t);}});
    return sum>0?{t:names.join(' + '),plan:sum,d:new Date(d)}:null;
  }
  function whatBreaks(d){
    var own=dayOut(d);
    if(own)return {e:own,d:own.d};
    var best=null,i,dd,o;
    for(i=1;i<=12;i++){
      dd=addDays(d,-i);
      if(dnum(dd)<dnum(today()))break;
      o=dayOut(dd);
      if(o&&(!best||o.plan>best.plan))best=o;
    }
    return best?{e:best,d:best.d}:null;
  }

  /* Конкретные способы закрыть нехватку — по убыванию реалистичности. */
  function fixes(short,day){
    var out=[],gigs=Math.ceil(short/(S.fee||100000));
    out.push({t:'Отработать ещё '+gigs+' '+plural(gigs,'концерт','концерта','концертов'),
              v:'+'+fmt(gigs*(S.fee||100000))+' ₸', good:true, act:'gigs'});
    // копилка на досрочку — это твои же деньги, просто отложенные
    if(S.pot>0)
      out.push({t:'Вернуть из копилки на досрочку', v:fmt(Math.min(S.pot,short))+' ₸',
                good:S.pot>=short, act:'pot'});
    if(S.cushionHave>0)
      out.push({t:'Взять из подушки', v:fmt(Math.min(S.cushionHave,short))+' ₸',
                good:S.cushionHave>=short, act:'cush'});
    else if(!S.pot)
      out.push({t:'Взять из подушки', v:'пусто', good:false});
    var safe=maxDaily(HORIZON).per;
    if(safe>0)out.push({t:'Урезать до '+fmt(safe)+' ₸ в день',
                        v:'ниже минимума', good:false});
    else out.push({t:'Урезать траты', v:'не спасёт даже ноль', good:false});
    var b=day?whatBreaks(day):null;
    if(b)out.push({t:'Перенести «'+b.e.t+'»', v:ruDate(b.d), good:false});
    return out;
  }

  /* Типичный месячный доход для каскада. Бонус берётся по среднему числу
     концертов за внесённые месяцы — если их нет, по ручным полям дохода. */
  function typicalIncome(){
    var inc=0;
    S.incomes.forEach(function(i){
      if(!i.on)return;
      if(i.fromConcerts){
        var months={},n=0,sum=0;
        S.concerts.forEach(function(c){
          if(!months[c.ym]){months[c.ym]=1;n++;}
          sum+=(typeof c.fee==='number'?c.fee:S.fee);
        });
        if(n>0){inc+=Math.round(sum/n);return;}
      }
      inc+=(S.mode==='min'?i.min:(i.plan||i.min));
    });
    return inc;
  }
  /* верно ли, что ближайший бонус посчитан по концертам, а не взят с потолка */
  function bonusKnown(){
    var b=S.incomes.filter(function(i){return i.on&&i.fromConcerts;})[0];
    if(!b)return null;
    var n=nextIncomeOf(b);
    if(!n)return null;
    var c=concertsFor(n.d);
    return {d:n.d,n:c.n,sum:c.sum,ym:c.ym,known:c.n>0,
            shown:c.n>0?c.sum:(S.mode==='min'?b.min:(b.plan||b.min))};
  }
  function nextIncomeOf(inc){
    var t=today();
    for(var i=0;i<=70;i++){
      var d=addDays(t,i);
      if(d.getDate()===effDay(incDay(inc),d)&&!isPaid(inc.id+'|'+ymKey(d)))return {d:d,inc:inc};
    }
    return null;
  }

  /* ---------- когда закончатся долги ---------- */
  var MONSHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var MON=['январь','февраль','март','апрель','май','июнь',
           'июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  function monthAfter(k){
    var d=today(),x=new Date(d.getFullYear(),d.getMonth()+k,1);
    return MON[x.getMonth()]+' '+x.getFullYear();
  }

  /* Помесячный каскад: обязательные платежи, затем всё свободное — в очередь досрочки.
     Мелкие цели копятся и закрываются целиком, крупные гасятся частями (правила 4 и 5).
     Займы с prio 0 досрочно не трогаются — они и определяют дату чаще всего. */
  function payoffPlan(food){
    if(food===undefined)food=S.foodDay;
    var L=S.loans.filter(function(l){return !l.closed;}).map(function(l){
      return {name:l.name,b:l.payoff,pm:l.payment,r:(l.rate||0)/1200,prio:l.prio,at:0};
    });
    if(!L.length)return null;
    var inc=typicalIncome();
    var out=billsMonth()-kaspiTotal()+food*30;
    var cash=S.balance,interest=0,m,done=null;
    for(m=1;m<=72;m++){
      var open=L.filter(function(l){return l.b>0.5;});
      if(!open.length){done=m-1;break;}
      cash+=inc-out;
      open.forEach(function(l){
        var pay=Math.min(l.pm,l.b);
        cash-=pay;l.b-=pay;
        interest+=l.b*l.r;l.b*=(1+l.r);
        if(l.b<0.5){l.b=0;l.at=m;}
      });
      while(cash>0){
        var q=L.filter(function(l){return l.b>0.5&&l.prio>0;})
               .sort(function(a,b){return a.prio-b.prio;});
        if(!q.length)break;
        var t=q[0];
        if(t.b<=100000){
          if(cash>=t.b){cash-=t.b;t.b=0;t.at=m;} else break;
        } else {
          var p=Math.min(cash,t.b);t.b-=p;cash-=p;
          if(t.b<0.5){t.b=0;t.at=m;}
          break;
        }
      }
    }
    var mx=0;L.forEach(function(l){if(l.at>mx)mx=l.at;});
    var lastOnes=L.filter(function(l){return l.at===mx&&mx>0;});
    // в последний месяц может закрыться несколько займов; дату реально держит тот,
    // что идёт по графику — досрочно его не ускорить
    var block=null;
    lastOnes.forEach(function(l){if(l.prio===0&&!block)block=l;});
    if(!block&&lastOnes.length)block=lastOnes[0];
    return {months:done,interest:interest,food:food,
            blockName:block?block.name:'',blockSched:block?block.prio===0:false};
  }

  /* ---------- сводка для Claude ---------- */
  function finContext(){
    var D=daily(),F=forecast(HORIZON),W=worstGap(HORIZON),t=today(),L=[];
    var mIn=0;S.incomes.forEach(function(i){if(i.on)mIn+=incAmt(i);});
    var mOut=billsMonth()+S.foodDay*30;

    L.push('Это выгрузка из моего приложения учёта личных финансов. Валюта — тенге (₸).');
    L.push('Сегодня '+ruDate(t)+' '+t.getFullYear()+' г.');
    L.push('');
    L.push('== ДЕНЬГИ СЕЙЧАС ==');
    L.push('На руках: '+fmt(S.balance)+'; отложено на досрочное погашение: '+fmt(S.pot));
    var odS=overdueTotal();
    if(odS>0){
      L.push('Из них УЖЕ ДОЛЖЕН, но ещё не заплачено: '+fmt(odS)+'. Это просроченные или сегодняшние платежи:');
      overdueList().forEach(function(o){L.push('   - '+o.e.t+' '+fmt(o.e.plan)+' (срок '+ruDate(o.d)+')');});
      L.push('Реально свободно: '+fmt(spendable())+'.');
    }
    L.push('Подушка на платежи: '+fmt(S.cushionHave)+' из '+fmt(S.cushion)+
           ' (цель — один месяц платежей по кредитам: Kaspi 12-го и МФО 18-го).');
    L.push('Еда: '+fmt(S.foodDay)+' в день ('+fmt(S.foodDay*30)+' в месяц)');
    var NN=norm();
    L.push('Минимум на жизнь (еда, проезд, сигареты): '+fmt(S.floor)+' в день — меньше тратить я не могу.');
    if(NN.floored){
      L.push('ГЛАВНАЯ ПРОБЛЕМА: даже на этом минимуме '+ruDate(NN.day)+' не хватает '+fmt(NN.short)+'.');
      L.push('Математический максимум без ухода в минус — '+fmt(NN.safe)+' в день, но это ниже минимума на жизнь, то есть нереально.');
      L.push('Мне нужен не совет экономить, а способ добрать '+fmt(NN.short)+' к '+ruDate(NN.day)+
             ' — например '+Math.ceil(NN.short/(S.fee||100000))+' доп. концертов или перенос платежа.');
    } else {
      L.push('Можно тратить в день, не уходя в минус за 60 дней: '+fmt(NN.per));
    }
    L.push('Обязательные платежи ближайших 30 дней: '+fmt(D.res));
    L.push('Прогноз при текущей трате: минимум '+fmt(F.min.v)+' наступит '+ruDate(F.min.d));
    if(W.v<0)L.push('РИСК: в худшем сценарии (доход по нижней границе и с задержкой, нулевые траты) не хватает '+fmt(-W.v)+' к '+ruDate(W.d)+'.');
    else L.push('Худший сценарий (доход по нижней границе и с задержкой, нулевые траты) проходит с запасом '+fmt(W.v)+'.');
    L.push('За месяц: доход '+fmt(mIn)+', расход '+fmt(mOut)+', остаётся на досрочку '+fmt(mIn-mOut));
    L.push('');
    var bkc=bonusKnown();
    if(bkc){
      if(bkc.known)L.push('Бонус '+ruDate(bkc.d)+' посчитан точно: '+bkc.n+' концертов за '+monthName(bkc.ym)+' × ставка = '+fmt(bkc.sum)+'.');
      else L.push('ВНИМАНИЕ: бонус '+ruDate(bkc.d)+' = '+fmt(bkc.shown)+' — это старая оценка, а не факт. Концерты за '+monthName(bkc.ym)+' не внесены. Не считай эту цифру надёжной.');
    }
    var needGigs=Math.ceil((billsMonth()+S.foodDay*30-150000)/S.fee);
    L.push('Чтобы месяц выходил в ноль, нужно примерно '+needGigs+' концертов в месяц при ставке '+fmt(S.fee)+'.');
    L.push('');
    L.push('== ДОХОДЫ ==');
    S.incomes.forEach(function(i){if(i.on)L.push('- '+i.title+': '+i.day+'-го, минимум '+fmt(i.min)+', реально жду '+fmt(i.plan||i.min)+', задержка до '+(i.delay||0)+' дн.');});
    L.push('== РЕГУЛЯРНЫЕ ПЛАТЕЖИ ==');
    S.bills.forEach(function(b){if(b.on)L.push('- '+b.title+': '+b.day+'-го, '+fmt(b.min)+(b.max!==b.min?'–'+fmt(b.max):''));});
    payDays().forEach(function(d){var k=loansOnDay(d);if(k>0)L.push('- '+dayLabel(d)+': '+d+'-го, '+fmt(k));});
    L.push('');
    var open=S.loans.filter(function(l){return !l.closed;});
    var q=open.filter(function(l){return l.prio>0;}).sort(function(a,b){return a.prio-b.prio;});
    var sch=open.filter(function(l){return l.prio===0;});
    var interest=0;open.forEach(function(l){if(l.rate>0)interest+=l.payment*l.months-l.payoff;});
    L.push('== ДОЛГИ: '+open.length+' открытых ==');
    L.push('Всего закрыть сегодня: '+fmt(debtTotal())+'. Платежей в месяц: '+fmt(kaspiTotal())+'. Переплата впереди по графику: '+fmt(interest)+'.');
    L.push('Очередь досрочного погашения:');
    q.forEach(function(l,i){
      L.push('  '+(i+1)+'. '+l.name+' — закрыть за '+fmt(l.payoff)+', платёж '+fmt(l.payment)+' ('+loanDay(l)+'-го), осталось '+l.months+' мес, ставка '+l.rate+'% годовых');
    });
    L.push('Платить строго по графику, досрочно НЕ гасить:');
    sch.forEach(function(l){
      L.push('  - '+l.name+' — остаток '+fmt(l.payoff)+', платёж '+fmt(l.payment)+', '+l.months+' мес, ставка '+(l.rate===0?'0% (рассрочка)':l.rate+'%'));
    });
    var cl=S.loans.filter(function(l){return l.closed;});
    if(cl.length)L.push('Уже закрыты: '+cl.map(function(l){return l.name;}).join(', '));
    if(S.tx.length){
      var curYM=ymKey(t),cIn=0,cOut=0,cBy={};
      S.tx.forEach(function(x){
        if(txYM(x)!==curYM)return;
        if(x.amount>0)cIn+=x.amount;
        else{cOut-=x.amount;cBy[x.cat||'unknown']=(cBy[x.cat||'unknown']||0)-x.amount;}
      });
      L.push('');
      L.push('== ФАКТ ЗА '+monthName(curYM).toUpperCase()+' (по моим записям, а не по оценке) ==');
      L.push('Доход '+fmt(cIn)+', расход '+fmt(cOut)+'. Записей всего в истории: '+S.tx.length+'.');
      var cl2=[];for(var ck in cBy)cl2.push([ck,cBy[ck]]);
      cl2.sort(function(a,b){return b[1]-a[1];});
      cl2.forEach(function(c){L.push('   - '+catName(c[0])+': '+fmt(c[1]));});
      if(cBy['unknown'])L.push('   (часть не разнесена по категориям — цифры по ним неточные)');
      L.push('');
      L.push('== ПОСЛЕДНИЕ ОПЕРАЦИИ ==');
      S.tx.slice(0,10).forEach(function(x){L.push('  '+x.date+' — '+x.title+' ('+catName(x.cat)+') '+(x.amount>0?'+':'')+fmt(x.amount));});
    }
    var P=payoffPlan(),P2=payoffPlan(Math.round(S.foodDay*0.6));
    if(P){
      L.push('');
      L.push('== ПРОГНОЗ ВЫХОДА ИЗ ДОЛГОВ ==');
      L.push('(посчитано самим приложением помесячным каскадом: обязательные платежи, всё свободное — в очередь досрочки, высвободившийся платёж переназначается дальше)');
      if(P.months===null)L.push('При нынешних доходах и тратах долги не закрываются и за 6 лет.');
      else{
        L.push('Все долги закрыты через '+P.months+' мес — это '+monthAfter(P.months)+'. Процентов за это время: '+fmt(P.interest)+'.');
        if(P.blockName)L.push('Дату определяет «'+P.blockName+'»'+(P.blockSched?
          '. Этот заём гасится строго по графику и досрочно не ускоряется — поэтому экономия на расходах саму дату НЕ сдвинет, а только уменьшит проценты и оставит больше денег на руках. Не утверждай обратное, не проверив.':'.'));
      }
      if(P2&&P2.months!==null)
        L.push('Для сравнения, если урезать еду до '+fmt(Math.round(S.foodDay*0.6))+' в день: срок '+P2.months+' мес, процентов '+fmt(P2.interest)+'.');
    }
    L.push('');
    L.push('== ПРАВИЛА МОЕЙ СТРАТЕГИИ, их нарушать нельзя ==');
    L.push('1. Рассрочка под 0% досрочно не гасится никогда.');
    L.push('2. Займы около 11% годовых досрочно не гасятся — деньги эффективнее направить в дорогие.');
    L.push('3. Освободившийся платёж переназначается на следующую цель, а не растворяется в бюджете.');
    L.push('4. Мелкие цели (до 100 000) — копить и закрывать целиком: частичный платёж не убирает обязательство и не снижает минимум.');
    L.push('5. Крупные цели — вносить частями сразу, не копить: остаток капает под 37%.');
    L.push('6. Никаких новых кредитов и рассрочек.');
    L.push('7. Перед каждым погашением сверять сумму в приложении банка — она пересчитывается ежедневно.');
    L.push('8. Главный управляемый расход — еда. Это единственная крупная статья, которую я могу резать.');
    L.push('9. Подушка копится до '+fmt(S.cushion)+' и тратится только на платежи по кредитам, а не на текущие хотелки.');
    L.push('');
    L.push('Отвечай по-русски, конкретными суммами и датами, считай по цифрам выше. Без общих советов про финансовую дисциплину — я хорошо считаю сам.');
    return L.join('\n');
  }

  /* ---------- рендер ---------- */
  var root=document.getElementById('root');

  function render(){
    var html='<div class="wrap">';
    if(S.tab==='today')  html+=viewToday();
    if(S.tab==='debts')  html+=viewDebts();
    if(S.tab==='hist')   html+=viewHistory();
    if(S.tab==='gigs')   html+=viewGigs();
    if(S.tab==='fixed')  html+=viewFixed();
    if(S.tab==='ask')    html+=viewAsk();
    if(S.tab==='setup')  html+=viewSetup();
    html+='</div>';
    html+=tabsHtml();
    html+='<div class="toast" id="toast"></div>';
    root.innerHTML=html;
    bind();
  }

  function tabsHtml(){
    var T=[['today','Сегодня','◉'],['debts','Долги','▤'],['hist','История','▦'],
           ['gigs','Концерты','♪'],['fixed','Платежи','⟳'],['ask','Совет','✦'],['setup','Ещё','⚙']];
    return '<nav class="tabs">'+T.map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'"><span class="ic">'+t[2]+'</span>'+t[1]+'</button>';
    }).join('')+'</nav>';
  }

  function viewToday(){
    var D=daily(),N=norm(),h='',per=N.per,left=per-D.spent;
    var od=overdueList(),odSum=overdueTotal();

    h+='<div class="hero">';
    h+='<div class="lbl">'+(left<0?'Перерасход за сегодня':'Можно потратить сегодня')+'</div>';
    h+='<div class="big num'+(left<0?' neg':'')+'">'+fmt(left)+' ₸</div>';
    h+='<div class="sub">'+(N.floored
        ? 'это минимум на жизнь — еда, проезд, сигареты. Денег на него не хватает, смотри ниже'
        : 'норма '+fmt(per)+' ₸ в день, чтобы не уйти в минус за '+HORIZON+' дней')+
       (D.inc?' · '+esc(D.inc.inc.title).toLowerCase()+' '+ruDate(D.inc.d):'')+'</div>';
    h+='<div class="heroRow">';
    h+='<div class="heroCell"><div class="k">На счету</div><div class="v num">'+fmt(S.balance)+'</div></div>';
    h+='<div class="heroCell"><div class="k">'+(odSum>0?'Из них должен':'Потрачено сегодня')+'</div><div class="v num">'+
       fmt(odSum>0?odSum:D.spent)+'</div></div>';
    h+='<div class="heroCell"><div class="k">Свободно</div><div class="v num">'+fmt(spendable())+'</div></div>';
    h+='</div></div>';

    // ---- нехватка: сумма, дата, откуда взять ----
    if(N.floored&&N.short>0){
      h+='<div class="card" style="border-color:var(--bad)">';
      h+='<h3 style="color:var(--bad)">'+ruDate(N.day)+' не хватит '+fmt(N.short)+' ₸</h3>';
      h+='<div class="mini" style="margin-bottom:9px">Это ближайший срок, когда деньги кончатся, если тратить '+fmt(S.floor)+
         ' ₸ в день — твой минимум на жизнь. Меньше тратить нельзя, значит вопрос не в экономии, а в том, откуда взять недостающее к этой дате.</div>';
      var bad2=whatBreaks(N.day);
      if(bad2)h+='<div class="mini" style="margin-bottom:9px">Ломается на платеже «'+esc(bad2.e.t)+'» '+
         fmt(bad2.e.plan)+' ₸ '+ruDate(bad2.d)+'.</div>';
      h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>На счету</span><span>'+fmt(S.balance)+'</span></div>';
      if(odSum>0)h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>Из них уже должен</span><span style="color:var(--bad)">−'+fmt(odSum)+'</span></div>';
      if(S.pot>0)h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>Отложено в копилку на досрочку</span><span>−'+fmt(S.pot)+'</span></div>';
      h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;font-weight:700"><span>Свободно</span><span>'+fmt(spendable())+'</span></div>';
      var bk2=bonusKnown();
      if(bk2)h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>Бонус '+ruDate(bk2.d)+(bk2.known?' ('+bk2.n+' конц.)':' (оценка)')+'</span><span>+'+fmt(bk2.shown)+'</span></div>';
      h+='<div class="sep"></div>';
      h+='<div class="mini" style="margin-bottom:6px">Чем закрыть:</div>';
      fixes(N.short,N.day).forEach(function(x){
        h+='<div class="fixrow"><span>'+esc(x.t)+'</span>'+
           '<span style="color:'+(x.good?'var(--good)':'var(--muted)')+'">'+esc(x.v)+'</span></div>';
        if(x.act==='pot')h+='<button class="btn ghost sm" id="potBack" style="margin:4px 0 6px;width:100%">Вернуть копилку в оборот</button>';
        if(x.act==='cush')h+='<button class="btn ghost sm" id="cushBack" style="margin:4px 0 6px;width:100%">Распечатать подушку</button>';
      });
      var fx=fixes(N.short,N.day),nGood=0;
      fx.forEach(function(x){if(x.good)nGood++;});
      h+='<div class="hint">'+(nGood>1
        ? 'Зелёным отмечено то, чего хватает на ближайший срок. Деньги из копилки решают вопрос сегодня, но откладывают погашение; концерты решают его насовсем.'
        : 'Зелёным отмечено то, чего хватает. Серое показано специально — чтобы было видно, что эти пути не спасают, и ты не тратил на них время.')+'</div>';
      if(N.worst>N.short+1){
        var gigsAll=Math.ceil(N.worst/(S.fee||100000));
        h+='<div class="alert warn" style="margin:10px 0 0">Это только ближайшая дыра. Если ничего не менять, к '+
           ruDate(N.worstDay)+' она дорастёт до '+fmt(N.worst)+' ₸ — это уже '+gigsAll+' '+
           plural(gigsAll,'концерт','концерта','концертов')+'. Считай '+ruDate(N.day)+' дедлайном, а не концом проблемы.</div>';
      }
      h+='</div>';
    }

    // ---- к оплате: просроченное и сегодняшнее ----
    if(od.length){
      h+='<div class="card"><h3>Надо заплатить<span class="aside">'+fmt(odSum)+' ₸</span></h3>';
      od.forEach(function(o){
        var late=dnum(o.d)<dnum(today());
        h+='<div class="due'+(late?' late':'')+'">';
        h+='<div class="i"><b>'+esc(o.e.t)+'</b><small>'+
           (late?'просрочено с '+ruDate(o.d):'срок сегодня')+'</small></div>';
        h+='<div class="a num">'+fmt(o.e.plan)+'</div>';
        h+='<button class="btn sm" data-paid="'+esc(o.e.key)+'" data-amt="'+o.e.plan+'" data-ttl="'+esc(o.e.t)+'">Оплачено</button>';
        h+='</div>';
      });
      h+='<div class="hint">Пока не отмечено — эти деньги вычитаются из доступных, хотя ещё лежат на счету. Отметишь — запись сама попадёт в историю.</div></div>';
    }

    // ---- ближайшее ----
    var soon=dueSoon(6);
    if(soon.length){
      h+='<div class="card"><h3>Ближайшее</h3>';
      soon.forEach(function(o){
        var dd=Math.round((o.d-today())/86400000);
        h+='<div class="due">';
        h+='<div class="i"><b>'+esc(o.e.t)+'</b><small>'+ruDate(o.d)+' · через '+dd+' '+plural(dd,'день','дня','дней')+'</small></div>';
        h+='<div class="a num" style="color:'+(o.e.a>0?'var(--good)':'var(--ink)')+'">'+(o.e.a>0?'+':'')+fmt(o.e.a)+'</div>';
        if(o.e.a<0)h+='<button class="btn ghost sm" data-paid="'+esc(o.e.key)+'" data-amt="'+o.e.plan+'" data-ttl="'+esc(o.e.t)+'">Оплачено</button>';
        else h+='<button class="btn ghost sm" data-got="'+esc(o.e.key)+'" data-amt="'+o.e.plan+'" data-ttl="'+esc(o.e.t)+'">Пришли</button>';
        h+='</div>';
      });
      h+='</div>';
    }

    // ---- предупреждения ----
    var W=worstGap(HORIZON),F=forecast(HORIZON);
    if(W.v<0){
      h+='<div class="alert bad"><b>Худший сценарий: не хватает '+fmt(-W.v)+' ₸ к '+ruDate(W.d)+'</b><br>'+
         'Так будет, если доход придёт по нижней границе и с задержкой — даже при нулевых тратах. '+
         'Договариваться о переносе платежа нужно сейчас, а не '+ruDate(W.d)+'.</div>';
    }
    if(F.min.v<0&&!N.floored){
      h+='<div class="alert bad"><b>Деньги закончатся '+ruDate(F.min.d)+'</b><br>'+
         'При трате '+fmt(S.foodDay)+' ₸ в день прогноз уходит в минус до '+fmt(F.min.v)+' ₸. '+
         'Безопасная норма — '+fmt(per)+' ₸ в день.</div>';
    } else if(F.min.v>=0&&F.min.v<50000){
      h+='<div class="alert warn">Самая тонкая точка — '+ruDate(F.min.d)+', останется '+fmt(F.min.v)+' ₸. Запас почти нулевой.</div>';
    }

    var bk=bonusKnown();
    if(bk&&!bk.known){
      h+='<div class="alert warn"><b>Бонус '+ruDate(bk.d)+' взят с потолка: '+fmt(bk.shown)+' ₸</b><br>'+
         'Внеси концерты за '+monthName(bk.ym)+' на вкладке «Концерты» — и приложение посчитает бонус точно, а не по старой оценке.</div>';
    }

    var crunch=0;
    S.bills.forEach(function(b){if(b.on&&(b.day===17||b.day===18))crunch+=billAmt(b);});
    crunch+=loansOnDay(17)+loansOnDay(18);
    if(crunch>0){
      h+='<div class="alert warn"><b>17–18 числа: '+fmt(crunch)+' ₸ за два дня</b><br>'+
         'Жильё и платёж в МФО стоят вплотную. Если бонус задержится до 19–20-го, оба платежа провалятся. Эту сумму держи отложенной с прошлого месяца.</div>';
    }

    // ---- быстрый ввод ----
    h+='<div class="card"><h3>Записать</h3>';
    h+='<input type="text" id="qi" placeholder="такси 1500 · обед 4200 · подработка +50000">';
    h+='<div class="grid2" style="margin-top:8px">';
    h+='<button class="btn" id="qExp">Расход</button>';
    h+='<button class="btn ghost" id="qInc">Доход</button>';
    h+='</div>';
    h+='<div class="hint">Пиши как удобно: сумма и что это. Знак «+» сразу пишет доход. Категория определится сама, поправить можно в «Истории».</div></div>';

    // ---- распределитель ----
    h+=allocCard(per);

    // ---- лента ----
    h+='<div class="card"><h3>Что будет дальше<span class="aside">'+(S.mode==='min'?'пессимистично':'по плану')+'</span></h3>';
    var rows=timeline(HORIZON);
    if(rows.length)h+=timelineHtml(rows);
    else h+='<div class="mini">В ближайшие '+HORIZON+' дней событий нет.</div>';
    h+='<div class="hint">Остаток посчитан при трате '+fmt(S.foodDay)+' ₸ в день — это поле «еда» на вкладке «Регулярное». Отмеченное как оплаченное из ленты исчезает.</div>';
    h+='<div class="grid2" style="margin-top:10px">';
    h+='<button class="btn ghost sm" id="mMin"'+(S.mode==='min'?' disabled':'')+'>Худший сценарий</button>';
    h+='<button class="btn ghost sm" id="mPlan"'+(S.mode==='plan'?' disabled':'')+'>Ожидаемый</button>';
    h+='</div></div>';

    // ---- цель досрочки ----
    var g=target();
    if(g){
      var need=Math.max(0,g.payoff-S.pot);
      var pct=Math.min(100,Math.round(S.pot/g.payoff*100));
      h+='<div class="card"><h3>Цель: '+esc(g.name)+'<span class="aside">'+g.rate+'% годовых</span></h3>';
      h+='<div class="row"><div class="t"><b>Накоплено на досрочку</b><small>освободит '+fmt(g.payment)+' ₸ в месяц</small></div>'+
         '<div class="v num">'+fmt(S.pot)+' / '+fmt(g.payoff)+'</div></div>';
      h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
      h+='<div class="hint">Осталось собрать '+fmt(need)+' ₸.</div>';
      h+='<div class="grid2" style="margin-top:10px">';
      h+='<input type="number" id="potAdd" placeholder="сумма" inputmode="numeric">';
      h+='<button class="btn" id="potBtn">В копилку</button>';
      h+='</div></div>';
    }

    // ---- история, коротко ----
    if(S.tx.length){
      h+='<div class="card"><h3>Последнее<span class="aside">'+S.tx.length+' '+plural(S.tx.length,'запись','записи','записей')+'</span></h3>';
      S.tx.slice(0,8).forEach(function(x){h+=txRow(x);});
      h+='<button class="btn ghost sm" data-tab="hist" style="margin-top:9px">Вся история и сводка</button>';
      h+='</div>';
    }
    return h;
  }

  /* ближайшие события после сегодняшнего дня */
  function dueSoon(n){
    var t=today(),out=[],i,d;
    for(i=1;i<=45&&out.length<n;i++){
      d=addDays(t,i);
      eventsOn(d).forEach(function(e){if(out.length<n)out.push({d:new Date(d),e:e});});
    }
    return out;
  }

  function txRow(x){
    return '<div class="row"><div class="t"><b>'+catIcon(x.cat)+' '+esc(x.title)+'</b>'+
      '<small>'+esc(x.date)+' · '+esc(catName(x.cat))+'</small></div>'+
      '<div class="v num" style="color:'+(x.amount>0?'var(--good)':'var(--ink)')+'">'+
      (x.amount>0?'+':'')+fmt(x.amount)+'</div></div>';
  }

  function plural(n,a,b,c){
    n=Math.abs(n)%100;
    if(n>=11&&n<=14)return c;
    n=n%10;
    if(n===1)return a;
    if(n>=2&&n<=4)return b;
    return c;
  }
  function monthName(ym){
    return MON[parseInt(ym.slice(5),10)-1]+' '+ym.slice(0,4);
  }

  /* ---------- распределитель ---------- */
  function allocCard(per){
    var free=freeCash(),h='';
    h+='<div class="card"><h3>Что делать с деньгами</h3>';

    var safe=maxDaily(HORIZON).per;
    if(free<0){
      if(safe>=S.floor){
        h+='<div class="alert warn" style="margin:0 0 10px"><b>Тратишь больше, чем можешь</b><br>'+
           'Заложено '+fmt(S.foodDay)+' ₸ в день, а выдержишь '+fmt(safe)+
           '. Это выше минимума на жизнь, так что вопрос решается экономией.</div>';
        h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span>Резать нужно на</span><span>'+fmt(S.foodDay-safe)+' ₸ в день</span></div>';
        h+='<button class="btn" id="setPer" style="margin-top:10px;width:100%">Поставить '+fmt(safe)+' ₸ в день</button>';
      } else {
        h+='<div class="alert bad" style="margin:0 0 10px"><b>Экономией это не решается</b><br>'+
           'Даже на минимуме '+fmt(S.floor)+' ₸ в день денег не хватает. Что делать — в красном блоке выше.</div>';
      }
      h+='<div class="hint">Свободных денег нет: всё, что есть, уже расписано по платежам на '+HORIZON+' дней вперёд.</div></div>';
      return h;
    }

    h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span>Свободно сверх всех обязательств</span><span><b>'+fmt(free)+' ₸</b></span></div>';
    h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span>Безопасная трата в день</span><span>'+fmt(per)+' ₸</span></div>';
    h+='<div class="ol" style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span>Подушка</span><span>'+fmt(S.cushionHave)+' / '+fmt(S.cushion)+' ₸</span></div>';

    if(free<1000){
      h+='<div class="hint">Свободных денег почти нет — всё уже расписано по платежам и еде на '+HORIZON+' дней вперёд.</div></div>';
      return h;
    }

    h+='<div class="sep"></div>';
    options(free).forEach(function(o,i){
      h+='<div class="opt'+(i===0?' pick':'')+'">';
      h+='<div class="oh"><b>'+esc(o.name)+'</b><span class="mini">'+fmt(free)+' ₸</span></div>';
      h+='<div class="ol"><span>В подушку</span><span>'+fmt(o.cush)+' ₸</span></div>';
      h+='<div class="ol"><span>В досрочку'+(o.goal?' («'+esc(o.goal.name)+'»)':'')+'</span><span>'+fmt(o.pot)+' ₸</span></div>';
      if(o.cush>0)h+='<div class="ol"><span>Подушка станет</span><span>'+fmt(o.cushAfter)+' / '+fmt(S.cushion)+'</span></div>';
      if(o.closes&&o.goal)h+='<div class="ol"><span>Закроет заём</span><span style="color:var(--good)">освободит '+fmt(o.goal.payment)+' ₸/мес</span></div>';
      h+='<div class="mini" style="margin-top:5px">'+esc(o.why)+'</div>';
      h+='<button class="btn ghost sm" data-alloc="'+i+'" style="margin-top:8px;width:100%">Применить</button>';
      h+='</div>';
    });
    h+='<div class="hint">«Свободно» — это минимум, ниже которого баланс не опустится за '+HORIZON+
       ' дней при трате '+fmt(S.foodDay)+' ₸ в день. Все платежи из ленты уже вычтены, эти деньги можно трогать безопасно.</div></div>';
    return h;
  }

  /* Лента по дням: события с остатком после каждого. Заменила график —
     по кривой нельзя было прочитать ни дату, ни сумму провала. */
  function timeline(days){
    var t=today(),bal=spendable(),rows=[],i,j,d,ev;
    for(i=1;i<=days;i++){
      d=addDays(t,i);
      bal-=S.foodDay;
      ev=eventsOn(d);
      if(!ev.length)continue;
      for(j=0;j<ev.length;j++)bal+=ev[j].a;
      rows.push({d:new Date(d),ev:ev,bal:bal});
    }
    return rows;
  }
  function timelineHtml(rows){
    var h='<div class="tl">';
    rows.forEach(function(r){
      h+='<div class="d'+(r.bal<0?' neg':'')+'">';
      h+='<div class="dt"><b>'+r.d.getDate()+'</b>'+MONSHORT[r.d.getMonth()]+'</div>';
      h+='<div class="ev">';
      r.ev.forEach(function(e){
        h+='<div class="e"><span>'+esc(e.t)+'</span><span class="m'+(e.a>0?' p':'')+'">'+
           (e.a>0?'+':'')+fmt(e.a)+'</span></div>';
      });
      h+='<div class="bal">остаток <b>'+fmt(r.bal)+' ₸</b></div>';
      h+='</div></div>';
    });
    return h+'</div>';
  }

  /* Сколько денег можно снять с баланса сегодня и всё равно ни разу
     не уйти в минус за горизонт при трате per в день. Это минимум
     прогноза: ниже него баланс не опускается, значит он свободен. */
  function freeCash(per){
    var r=simulate(HORIZON,per===undefined?S.foodDay:per);
    return r.min.v;
  }

  /* Варианты распределения свободных денег. */
  function options(free){
    var g=target(),need=Math.max(0,S.cushion-S.cushionHave),out=[];
    function mk(name,why,toC,toP){
      toC=Math.min(toC,free);toP=Math.min(toP,free-toC);
      return {name:name,why:why,cush:Math.round(toC),pot:Math.round(toP),
              rest:Math.round(free-toC-toP)};
    }
    out.push(mk('Сначала подушка','Пока не собран запас на платежи, любой сбой с бонусом — просрочка',
                need,free-Math.min(need,free)));
    out.push(mk('Пополам','Запас растёт и долг одновременно уменьшается',
                Math.min(need,free/2),free-Math.min(need,free/2)));
    out.push(mk('Всё в долг','Быстрее всего гасит проценты, но запаса не будет',0,free));
    out.forEach(function(o){
      o.cushAfter=S.cushionHave+o.cush;
      o.potAfter=S.pot+o.pot;
      o.closes=!!(g&&o.potAfter>=g.payoff);
      o.goal=g;
    });
    return out;
  }

  function chart(pts){
    var w=480,hh=120,pad=6;
    var vals=pts.map(function(p){return p.v;});
    var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
    if(mx===mn){mx=mn+1;}
    var zero=hh-pad-((0-mn)/(mx-mn))*(hh-pad*2);
    var d='';
    pts.forEach(function(p,i){
      var x=pad+(i/(pts.length-1))*(w-pad*2);
      var y=hh-pad-((p.v-mn)/(mx-mn))*(hh-pad*2);
      d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    });
    var s='<svg class="chart" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none">';
    if(mn<0&&mx>0){
      s+='<rect x="0" y="'+zero+'" width="'+w+'" height="'+(hh-zero)+'" fill="#F7E4DF"/>';
      s+='<line x1="0" y1="'+zero+'" x2="'+w+'" y2="'+zero+'" stroke="#A8371F" stroke-width="1" stroke-dasharray="4 4"/>';
    }
    s+='<path d="'+d+'" fill="none" stroke="#0F2A2C" stroke-width="2.5" stroke-linejoin="round"/>';
    s+='</svg>';
    s+='<div class="mini" style="display:flex;justify-content:space-between;margin-top:4px">'+
       '<span>'+ruDate(pts[0].d)+'</span><span>мин '+fmt(mn)+'</span><span>'+ruDate(pts[pts.length-1].d)+'</span></div>';
    return s;
  }

    }

    }

           '<button class="btn ghost sm" data-reopen="'+l.id+'">Вернуть</button></div></div>';

  function loanRow(l,n){
    var cls=l.rate===0?'zero':(l.rate>=30?'hot':(l.rate>=20?'mid':'cool'));

       (l.rate===0?'0%':l.rate+'%')+'</span>';
    h+='<div class="meta">'+fmt(l.payment)+' ₸ '+loanDay(l)+'-го · '+l.months+' мес · закрыть за '+fmt(l.payoff)+'</div>';

    h+='<button class="btn sm" data-close="'+l.id+'">Закрыт</button>';
    h+='<button class="btn ghost sm" data-pay="'+l.id+'">Внести</button>';
    h+='<button class="btn ghost sm" data-edit="'+l.id+'">Правка</button>';
    h+='</div></div></div>';

  /* ---------- история ---------- */
  var HF={ym:null,cat:null};

  function txYM(x){
    if(x.d)return String(x.d).slice(0,4)+'-'+String(x.d).slice(4,6);
    var d=new Date(x.ts||Date.now());
    return ymKey(d);
  }
  function monthsWithTx(){
    var seen={},out=[];
    S.tx.forEach(function(x){var k=txYM(x);if(!seen[k]){seen[k]=1;out.push(k);}});
    var now=ymKey(today());
    if(!seen[now])out.push(now);
    return out.sort().reverse();
  }

  function viewHistory(){
    var h='',months=monthsWithTx();
    if(!HF.ym||months.indexOf(HF.ym)<0)HF.ym=months[0];
    var list=S.tx.filter(function(x){return txYM(x)===HF.ym;});

    var inc=0,exp=0,byCat={};
    list.forEach(function(x){
      if(x.amount>0)inc+=x.amount; else exp-=x.amount;
      var c=x.cat||'unknown';
      if(x.amount<0)byCat[c]=(byCat[c]||0)-x.amount;
    });

    h+='<div class="hero"><div class="lbl">'+monthName(HF.ym)+'</div>';
    h+='<div class="big num'+((inc-exp)<0?' neg':'')+'">'+fmt(inc-exp)+' ₸</div>';
    h+='<div class="sub">разница между доходом и расходом за месяц</div>';
    h+='<div class="heroRow">';
    h+='<div class="heroCell"><div class="k">Доход</div><div class="v num">'+fmt(inc)+'</div></div>';
    h+='<div class="heroCell"><div class="k">Расход</div><div class="v num">'+fmt(exp)+'</div></div>';
    h+='<div class="heroCell"><div class="k">Записей</div><div class="v num">'+list.length+'</div></div>';
    h+='</div></div>';

    h+='<div class="card"><h3>Месяц</h3><div class="chips">';
    months.forEach(function(m){
      h+='<button class="chip'+(m===HF.ym?' on':'')+'" data-hym="'+m+'">'+monthName(m)+'</button>';
    });
    h+='</div></div>';

    // сводка по категориям
    var cats=[];
    for(var k in byCat)cats.push([k,byCat[k]]);
    cats.sort(function(a,b){return b[1]-a[1];});
    if(cats.length){
      h+='<div class="card"><h3>Куда ушли деньги<span class="aside">'+fmt(exp)+' ₸</span></h3>';
      cats.forEach(function(c){
        var pct=exp>0?Math.round(c[1]/exp*100):0;
        h+='<div class="row"><div class="t"><b>'+catIcon(c[0])+' '+esc(catName(c[0]))+'</b>'+
           '<small>'+pct+'% расхода</small></div><div class="v num">'+fmt(c[1])+'</div></div>';
        h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
      });
      var un=byCat['unknown']||0;
      if(un>0)h+='<div class="hint">'+fmt(un)+' ₸ не распознались по названию. Нажми на запись внизу и поставь категорию — дальше такие слова будут узнаваться.</div>';
      else h+='<div class="hint">Это фактические траты по записям, а не оценка. Сравни с нормой '+fmt(S.foodDay*30)+' ₸ в месяц.</div>';
      h+='</div>';
    }

    // фильтр по категории
    h+='<div class="card"><h3>Записи</h3><div class="chips">';
    h+='<button class="chip'+(!HF.cat?' on':'')+'" data-hcat="">Все</button>';
    cats.forEach(function(c){
      h+='<button class="chip'+(HF.cat===c[0]?' on':'')+'" data-hcat="'+c[0]+'">'+catIcon(c[0])+' '+esc(catName(c[0]))+'</button>';
    });
    h+='</div>';

    var shown=list.filter(function(x){return !HF.cat||(x.cat||'unknown')===HF.cat;});
    if(!shown.length)h+='<div class="mini">Записей нет.</div>';
    shown.forEach(function(x){
      h+='<div class="due">';
      h+='<div class="i"><b>'+catIcon(x.cat)+' '+esc(x.title)+'</b><small>'+esc(x.date)+' · '+esc(catName(x.cat))+'</small></div>';
      h+='<div class="a num" style="color:'+(x.amount>0?'var(--good)':'var(--ink)')+'">'+
         (x.amount>0?'+':'')+fmt(x.amount)+'</div>';
      h+='<button class="btn ghost sm" data-txed="'+x.id+'">Правка</button>';
      h+='<button class="btn ghost sm" data-txdel="'+x.id+'">×</button>';
      h+='</div>';
    });
    h+='<div class="hint">История хранится целиком и не обрезается. «Правка» меняет сумму, название и категорию, «×» удаляет запись и возвращает деньги на баланс.</div></div>';
    return h;
  }

  /* ---------- концерты ---------- */
  var GM=null;

  function parseGig(str,ym){
    var t=String(str||'').trim();
    if(!t)return null;
    var m=t.match(/^(\d{1,2})[.\s)]+(.*)$/);
    if(!m)return null;
    var day=parseInt(m[1],10);
    if(day<1||day>31)return null;
    var rest=m[2].trim(),fee=null;
    var fm=rest.match(/\s(\d[\d\s]{2,})$/);
    if(fm){fee=parseFloat(fm[1].replace(/\s/g,''));rest=rest.slice(0,fm.index).trim();}
    var parts=rest.split(/\s+/),venue=parts.shift()||'';
    return {id:'g'+Date.now()+'-'+Math.floor(Math.random()*10000),ym:ym,day:day,
            venue:venue,title:parts.join(' '),
            fee:(fee!==null&&isFinite(fee))?fee:S.fee};
  }

  function copyToClip(txt){
    var ta=document.getElementById('askDump');
    if(ta)ta.value=txt;
    var done=function(){toast('Скопировано — вставляй в Claude');};
    var manual=function(){
      if(ta){
        ta.focus();
        try{
          ta.setSelectionRange(0,txt.length);
          if(document.execCommand('copy')){done();return;}
        }catch(e){}
      }
      toast('Выдели текст внизу и скопируй вручную');
    };
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done,manual);
    else manual();
  }

  /* ---------- выгрузка платежей в Календарь ----------
     iOS не умеет локальные уведомления по расписанию для веб-приложений,
     а web push требует постоянно работающего сервера. Календарь даёт
     системные напоминания бесплатно и офлайн. */
  function pad2(n){return (n<10?'0':'')+n;}
  function icsDate(d){return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate());}
  function icsEsc(t){return String(t).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');}

  function buildIcs(){
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dengi//RU','CALSCALE:GREGORIAN',
           'METHOD:PUBLISH','X-WR-CALNAME:Платежи'];
    var t=today(),stamp=icsDate(t)+'T090000';
    var i,d,ev,j;
    for(i=1;i<=370;i++){
      d=addDays(t,i);
      ev=eventsOn(d);
      for(j=0;j<ev.length;j++){
        if(ev[j].a>=0)continue;
        var ttl=ev[j].t+' — '+fmt(ev[j].plan)+' ₸';
        L.push('BEGIN:VEVENT');
        L.push('UID:'+ev[j].key.replace(/[^\w-]/g,'_')+'@dengi');
        L.push('DTSTAMP:'+stamp+'Z');
        L.push('DTSTART;VALUE=DATE:'+icsDate(d));
        L.push('DTEND;VALUE=DATE:'+icsDate(addDays(d,1)));
        L.push('SUMMARY:'+icsEsc(ttl));
        L.push('DESCRIPTION:'+icsEsc('Из приложения «Деньги». Отметь оплату в приложении, иначе прогноз будет врать.'));
        // за 3 дня, за день и в 9 утра в день платежа
        ['-P3D','-P1D'].forEach(function(tr){
          L.push('BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:'+tr,
                 'DESCRIPTION:'+icsEsc(ttl),'END:VALARM');
        });
        L.push('BEGIN:VALARM','ACTION:DISPLAY','TRIGGER;RELATED=START:PT9H',
               'DESCRIPTION:'+icsEsc('Сегодня: '+ttl),'END:VALARM');
        L.push('END:VEVENT');
      }
    }
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }

  function downloadIcs(){
    var txt=buildIcs(),n=(txt.match(/BEGIN:VEVENT/g)||[]).length;
    try{
      var blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='platezhi.ics';
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},400);
      toast(n+' '+plural(n,'платёж','платежа','платежей')+' — открой файл');
    }catch(e){
      var d=document.getElementById('dump');
      if(d){d.value=txt;d.select();toast('Не скачалось — текст в поле копии');}
      else toast('Не получилось выгрузить');
    }
  }

  function parseEntry(s,sign){
    s=(s||'').trim();
    if(!s)return null;
    var forceInc=/(^|\s)\+\d/.test(s);
    s=s.replace(/(^|\s)\+(?=\d)/,'$1').trim();
    var m=s.match(/-?\d[\d\s.,]*/);
    if(!m)return null;
    var raw=m[0].replace(/[\s.,]+$/,'');
    var amt=parseFloat(raw.replace(/[\s,]/g,''));
    if(!isFinite(amt)||amt===0)return null;
    var title=s.replace(raw,'').trim().replace(/^[-–—:]+/,'').trim();
    if(!title)title=(forceInc||sign>0)?'Доход':'Расход';
    return {amount:Math.abs(amt)*((forceInc||sign>0)?1:-1),title:title};
  }

      var ts=Date.now(),amt=isInc?v:-v;

      S.tx.unshift({id:ts,ts:ts,d:dnum(today()),date:ruDate(new Date()),
                    title:title,amount:amt,cat:guessCat(title,amt),pkey:key});

        S.balance-=x.amount;
        if(x.pkey)unmarkPaid(x.pkey);
        S.tx=S.tx.filter(function(y){return String(y.id)!==id;});
        persist();render();toast('Удалено');
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-txed]'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-txed');
        var x=S.tx.filter(function(y){return String(y.id)===id;})[0];
        if(!x)return;
        var a=prompt('Сумма (со знаком минус для расхода)',x.amount);
        if(a===null)return;
        var v=parseFloat(String(a).replace(/[\s,]/g,''));
        if(!isFinite(v)||v===0){toast('Нужна сумма');return;}
        var t=prompt('Название',x.title);
        if(t===null)return;
        var names=CATS.map(function(c,i){return (i+1)+'. '+c[1];}).join('\n');
        var cur=0;CATS.forEach(function(c,i){if(c[0]===x.cat)cur=i+1;});
        var c=prompt('Категория — номер из списка:\n'+names,cur||CATS.length);
        S.balance+=v-x.amount;
        x.amount=v;x.title=String(t).trim()||x.title;
        if(c!==null){
          var ci=parseInt(c,10);
          if(ci>=1&&ci<=CATS.length)x.cat=CATS[ci-1][0];
        }
        persist();render();toast('Изменено');
      };
    });

    /* ---- концерты ---- */
    Array.prototype.forEach.call(document.querySelectorAll('[data-gm]'),function(b){
      b.onclick=function(){GM=b.getAttribute('data-gm');render();};
    });
    on('gAdd',function(){
      var el=document.getElementById('gi'),g=parseGig(el?el.value:'',GM||ymKey(today()));
      if(!g){toast('Начни с числа: «11 цкз Абзал Утешев»');return;}
      S.concerts.push(g);persist();render();
      toast('Концерт '+g.day+' '+g.venue+' · +'+fmt(g.fee)+' ₸');
    });
    var gi=document.getElementById('gi');
    if(gi)gi.onkeydown=function(e){if(e.key==='Enter'){var b=document.getElementById('gAdd');if(b)b.click();}};
    Array.prototype.forEach.call(document.querySelectorAll('[data-gdel]'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-gdel');
        S.concerts=S.concerts.filter(function(c){return c.id!==id;});
        persist();render();toast('Убрано');
      };
    });
    on('feeBtn',function(){
      var v=parseFloat(document.getElementById('feeSet').value);
      if(!isFinite(v)||v<=0){toast('Нужна сумма');return;}
      S.fee=v;persist();render();toast('Ставка '+fmt(v)+' ₸');
    });
    on('bs0',function(){S.bonusShift=0;persist();render();});
    on('bs1',function(){S.bonusShift=1;persist();render();});

    /* ---- подушка и календарь ---- */
    on('cuBtn',function(){
      S.cushionHave=parseFloat(document.getElementById('cuHave').value)||0;
      S.cushion=parseFloat(document.getElementById('cuGoal').value)||0;
      persist();render();toast('Сохранено');
    });
    on('icsBtn',downloadIcs);

    on('mMin',function(){S.mode='min';persist();render();});
    on('mPlan',function(){S.mode='plan';persist();render();});

    on('potBtn',function(){
      var v=parseFloat(document.getElementById('potAdd').value);
      if(!isFinite(v)||v<=0){toast('Нужна сумма');return;}
      S.pot+=v;persist();render();toast('В копилке '+fmt(S.pot)+' ₸');
    });
    on('potSetBtn',function(){
      S.pot=parseFloat(document.getElementById('potSet').value)||0;persist();render();toast('Сохранено');
    });
    on('balBtn',function(){
      S.balance=parseFloat(document.getElementById('balSet').value)||0;persist();render();toast('Баланс обновлён');
    });
    on('foodSave',function(){
      var fd=parseFloat(document.getElementById('foodDay').value);
      var fl=document.getElementById('floorDay');
      if(isFinite(fd)&&fd>=0)S.foodDay=fd;
      if(fl){var v=parseFloat(fl.value);if(isFinite(v)&&v>=0)S.floor=v;}
      if(S.foodDay<S.floor)S.foodDay=S.floor;
      persist();render();toast('Сохранено');
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-close'),l=S.loans.filter(function(x){return x.id===id;})[0];
        if(!l)return;
        if(!confirm('Закрыть «'+l.name+'» за '+fmt(l.payoff)+' ₸?'))return;
        var ts=Date.now();
        l.closed=true;l.paid=l.payoff;l.closeTx=ts;
        S.balance-=l.payoff;
        S.pot=Math.max(0,S.pot-l.payoff);
        S.tx.unshift({id:ts,ts:ts,d:dnum(today()),date:ruDate(new Date()),title:'Закрыт '+l.name,amount:-l.payoff,cat:'loans'});
        persist();render();
        toast('Освободилось '+fmt(l.payment)+' ₸ в месяц');
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-reopen]'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-reopen'),l=S.loans.filter(function(x){return x.id===id;})[0];
        if(!l)return;
        if(l.paid)S.balance+=l.paid;
        if(l.closeTx)S.tx=S.tx.filter(function(x){return x.id!==l.closeTx;});
        delete l.paid;delete l.closeTx;
        l.closed=false;persist();render();toast('Заём возвращён, деньги вернулись на баланс');
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pay]'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-pay'),l=S.loans.filter(function(x){return x.id===id;})[0];
        if(!l)return;
        var p=prompt('Сколько внести сверх графика в «'+l.name+'»?\nОстаток к закрытию: '+fmt(l.payoff),'');
        if(p===null)return;
        var v=parseFloat(String(p).replace(/[\s,]/g,''));
        if(!isFinite(v)||v<=0){toast('Нужна сумма');return;}
        if(v>=l.payoff){toast('Этого хватает на всё — жми «Закрыт»');return;}
        var ts=Date.now();
        l.payoff-=v;
        S.balance-=v;
        S.pot=Math.max(0,S.pot-v);
        S.tx.unshift({id:ts,ts:ts,d:dnum(today()),date:ruDate(new Date()),title:'Досрочно: '+l.name,amount:-v,cat:'loans'});
        persist();render();
        toast('Внесено '+fmt(v)+' ₸ · сверь новый остаток в Kaspi');
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-edit'),l=S.loans.filter(function(x){return x.id===id;})[0];
        if(!l)return;
        var p=prompt('Остаток к закрытию, '+l.name,l.payoff);
        if(p===null)return;
        var v=parseFloat(String(p).replace(/\s/g,''));
        if(isFinite(v)&&v>=0){
          l.payoff=v;
          var q=prompt('Ежемесячный платёж',l.payment);
          if(q!==null){var w=parseFloat(String(q).replace(/\s/g,''));if(isFinite(w))l.payment=w;}
          persist();render();toast('Обновлено');
        }
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(inp){
      inp.onchange=function(){
        var p=inp.getAttribute('data-f').split(':');
        var arr=p[0]==='inc'?S.incomes:S.bills;
        var o=arr.filter(function(x){return x.id===p[1];})[0];
        if(!o)return;
        var v=inp.value;
        o[p[2]]=(p[2]==='title')?v:(parseFloat(v)||0);
        if(p[0]==='bill'&&p[2]==='min'&&o.max<o.min)o.max=o.min;
        persist();render();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){
      b.onclick=function(){
        var p=b.getAttribute('data-del').split(':');
        if(p[0]==='inc')S.incomes=S.incomes.filter(function(x){return x.id!==p[1];});
        else S.bills=S.bills.filter(function(x){return x.id!==p[1];});
        persist();render();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ask]'),function(b){
      b.onclick=function(){
        var i=parseInt(b.getAttribute('data-ask'),10),txt=finContext();
        if(i>=0)txt+='\n\nВОПРОС: '+ASKS[i][2];
        copyToClip(txt);
      };
    });
    on('addBill',function(){
      S.bills.push({id:'b'+Date.now(),day:1,title:'Новый платёж',min:0,max:0,on:true});persist();render();
    });
    on('addInc',function(){
      S.incomes.push({id:'i'+Date.now(),day:1,title:'Подработка',min:0,max:0,plan:0,delay:0,on:true});persist();render();
    });

    on('expBtn',function(){
      var d=document.getElementById('dump');
      d.value=JSON.stringify(snapshot());
      d.select();toast('Скопируй текст себе');
    });
    on('impBtn',function(){
      try{
        var d=JSON.parse(document.getElementById('dump').value);
        for(var k in d){if(d[k]!==undefined)S[k]=d[k];}
        persist();render();toast('Загружено');
      }catch(e){toast('Не читается');}
    });
    on('resetBtn',function(){
      if(!confirm('Вернуть всё к исходным данным?'))return;
      S.balance=0;S.pot=0;S.foodDay=10000;S.mode='plan';S.tx=[];
      S.paid={};S.concerts=[];S.fee=100000;S.bonusShift=1;
      S.cushion=290523;S.cushionHave=0;S.since=dnum(today());S.floor=6000;
      S.loans=DEFAULT_LOANS.map(function(l){var c={};for(var k in l)c[k]=l[k];c.closed=false;return c;});
      S.bills=clone(DEFAULT_BILLS);S.incomes=clone(DEFAULT_INCOMES);
      persist();render();
    });
  }

  load(render);

  /* офлайн-доступ; на file:// и без поддержки просто ничего не делает */
  if(navigator.serviceWorker&&location.protocol.indexOf('http')===0){
    try{ navigator.serviceWorker.register('sw.js'); }catch(e){}
  }
})();
</script>

</body>
</html>
